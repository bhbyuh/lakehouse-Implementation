version: "3.8"

x-s3-env: &s3-env
  S3_ENDPOINT: http://minio:9000
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-admin}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-12345678}
  AWS_REGION: ${AWS_REGION:-us-east-1}

x-lakehouse-env: &lakehouse-env
  <<: *s3-env
  SPARK_MASTER_URL: spark://spark-master:7077
  HIVE_METASTORE_URI: thrift://hive-metastore:9083
  KAFKA_BOOTSTRAP: broker:9092
  ICEBERG_CATALOG: lakehouse
  ICEBERG_WAREHOUSE: s3://buck1/warehouse

services:
  spark-master:
    build:
      context: ./spark
    hostname: spark-master
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
    networks:
      - spark-network
    environment:
      <<: *lakehouse-env
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./code:/code
      - ./data:/data


  spark-worker-a:
    build:
      context: ./spark
    hostname: spark-worker-a
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    networks:
      - spark-network
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
      <<: *lakehouse-env
    volumes:
      - ./code:/code
      - ./data:/data


  spark-worker-b:
    build:
      context: ./spark
    hostname: spark-worker-b
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    depends_on:
      - spark-master
    ports:
      - "8082:8081"
    networks:
      - spark-network
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
      <<: *lakehouse-env
    volumes:
      - ./code:/code
      - ./data:/data

  broker:
    image: apache/kafka:4.3.1
    container_name: broker
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://broker:9092,CONTROLLER://broker:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092,EXTERNAL://localhost:9094 # add advertised list external to run python script
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT  # extra config to run python script that can hit kafka
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    networks:
      spark-network:

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: ""
    ports:
      - "7070:8080"
    depends_on:
      - broker  
    networks:
      spark-network:

  jupyter-local:
    build:
      context: ./spark
    command: python3 -m jupyterlab --allow-root --ip=0.0.0.0 --no-browser --ServerApp.token=''
    ports:
      - "8888:8888"
      - "4040:4040"
    environment:
      <<: *lakehouse-env
    volumes:
      - ./code:/app/code
      - ./data:/app/data
    networks:
      - spark-network

  hive-metastore:
    build:
      context: ./hive
    container_name: hive-metastore
    ports:
      - "9083:9083"
    environment:
      <<: *s3-env
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      HIVE_CUSTOM_CONF_DIR: /hive_custom_conf
    depends_on:
      postgres: {condition: service_healthy}
    # healthcheck:
    #   test: ["CMD-SHELL", "nc -z localhost 9083 || exit 1"]
    #   interval: 10s
    #   retries: 10
    #   start_period: 40s
    volumes:
      - ./hive_custom_conf:/hive_custom_conf
    networks:
      - spark-network


  postgres:
    image: postgres:15
    container_name: hive-postgres
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
      POSTGRES_DB: metastore
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - spark-network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-12345678}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 12
    networks:
      - spark-network
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    networks:
      - spark-network
    environment:
      <<: *s3-env
    entrypoint: >
      /bin/sh -c "
      until (mc alias set myminio $$S3_ENDPOINT $$AWS_ACCESS_KEY_ID $$AWS_SECRET_ACCESS_KEY) do echo waiting && sleep 2; done;
      mc mb --ignore-existing myminio/buck1;
      exit 0;
      "

  trino:
    image: trinodb/trino:483
    container_name: trino
    ports:
      - "8085:8080"
    volumes:
      - ./trino/etc:/etc/trino
    environment:
      <<: *s3-env
    depends_on:
      hive-metastore: {condition: service_started}
      createbuckets:  {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/v1/info | grep -q '\"starting\":false'"]
      interval: 10s
      retries: 20
    networks:
      - spark-network

networks:
  spark-network:
    name: lakehouse-network
    external: true

volumes:
    minio_data:
    postgres_data:
    hive_data: